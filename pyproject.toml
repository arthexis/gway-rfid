[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gway-rfid"
version = "0.1.0"
description = "Gway-native RFID reader abstraction and commands"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Rafael J. Guillén-Osorio" },
]
dependencies = [
  "cbor2>=5.6",
  "cryptography>=43",
]

[project.scripts]
gway-rfid = "gway_rfid.label_cli:main"

[project.optional-dependencies]
linux-printing = [
  "pyusb>=1.2",
]
printing = [
  "Pillow>=10",
  "qrcode>=7.4",
]
hardware = [
  "mfrc522==0.0.7",
  "RPi.GPIO==0.7.1",
  "spidev==3.8",
]
queue = [
  "kombu>=5.3,<6",
]
dev = [
  "pytest>=8",
  "Pillow>=10",
  "qrcode>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Ansible and installs into a temporary directory"]
