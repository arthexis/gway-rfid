[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gway-rfid"
version = "0.1.0"
description = "Gway-native RFID reader abstraction and commands"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Rafael J. Guillén-Osorio" },
]
dependencies = [
  "cbor2>=5.6",
  "cryptography>=43",
]

[project.optional-dependencies]
hardware = [
  "mfrc522==0.0.7",
  "RPi.GPIO==0.7.1",
  "spidev==3.8",
]
queue = [
  "kombu>=5.3,<6",
]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Enforce correctness and import hygiene; avoid opinionated simplification rules.
select = ["E4", "E7", "E9", "F", "I", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Intentional broad catches: release a held SPI lock even on interruption,
# and report an unavailable optional event transport without crashing callers.
"src/gway_rfid/backends/mfrc522.py" = ["BLE001"]
"src/gway_rfid/events.py" = ["BLE001"]
