[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gway-rfid"
version = "0.1.0"
description = "Gway-native RFID reader abstraction and commands"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Rafael J. Guillén-Osorio" },
]
dependencies = [
  "cbor2>=5.6",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
