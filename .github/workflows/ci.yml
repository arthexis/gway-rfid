name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tooling
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: test -n "$(find dist -name '*.whl' -print -quit)" && test -n "$(find dist -name '*.tar.gz' -print -quit)"

  ansible:
    name: Ansible validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: python -m pip install ansible-core
      - name: Validate playbook syntax
        run: ansible-playbook ansible/playbooks/install.yml -i localhost, --syntax-check
      - name: Validate deployment script
        run: sh -n deploy.sh
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Exercise fresh and repeated Ansible installation
        run: python -m pytest -q tests/test_ansible_integration.py

  ci:
    name: CI
    if: always()
    needs: [tests, package, ansible]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks
        env:
          TESTS: ${{ needs.tests.result }}
          PACKAGE: ${{ needs.package.result }}
          ANSIBLE: ${{ needs.ansible.result }}
        run: |
          set -euo pipefail
          for result in "$TESTS" "$PACKAGE" "$ANSIBLE"; do
            if [[ "$result" != "success" ]]; then
              echo "Required check failed or skipped: $result"
              exit 1
            fi
          done
